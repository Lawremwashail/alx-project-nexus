services:
  db:
    image: postgres:15
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - backend

  web:
    build:
      context: .
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: .env
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/post_images
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - backend

  worker:
    build:
      context: .
    command: celery -A core worker --loglevel=info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    entrypoint: ["/celery-entrypoint.sh"]
    networks:
      - backend

  beat:
    build:
      context: .
    command: celery -A core beat --loglevel=info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    entrypoint: ["/celery-entrypoint.sh"]
    networks:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  backend:
    driver: bridge

